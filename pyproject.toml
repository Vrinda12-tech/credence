[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beliefdelay"
version = "0.1.0"
description = "Delay-embedding memory vs Bayes-optimal belief state faithfulness in sequence models"
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.40", "mambapy", "numpy", "scipy", "pandas", "matplotlib", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
